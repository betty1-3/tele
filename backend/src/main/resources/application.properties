

spring.application.name=hospital-dashboard-backend
server.port=8080


spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:C##STUDENT}
spring.datasource.password=${DB_PASSWORD:STUDENT}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver



spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000


app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}


spring.jackson.serialization.write-dates-as-timestamps=false


logging.level.org.springframework.jdbc.core=INFO
logging.level.com.hospital.dashboard=DEBUG

# Optional catalog search index. Oracle remains the system of record.
app.elasticsearch.enabled=${ELASTICSEARCH_ENABLED:true}
app.elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
app.elasticsearch.api-key=${ELASTICSEARCH_API_KEY:}
app.elasticsearch.index=${ELASTICSEARCH_INDEX:telemedical-catalog-v1}
app.elasticsearch.sync-interval-ms=${ELASTICSEARCH_SYNC_INTERVAL_MS:300000}
app.elasticsearch.sync-initial-delay-ms=${ELASTICSEARCH_SYNC_INITIAL_DELAY_MS:30000}
